# SearXNG 配置（供 docker compose --profile searxng 使用）
# 官方文档：https://docs.searxng.org/
use_default_settings: true

server:
  # 仅供本机使用，请自行替换为随机字符串
  secret_key: "please-change-this-secret"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  # ★ 必须包含 json，否则检索接口会返回 403
  formats:
    - html
    - json

ui:
  static_use_hash: true
