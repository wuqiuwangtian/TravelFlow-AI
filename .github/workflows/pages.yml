name: Pages

# 把纯静态站点 site/（含 site/assets 截图）部署到 GitHub Pages。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署，避免互相覆盖。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署静态项目页
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: 上传 site/ 静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
