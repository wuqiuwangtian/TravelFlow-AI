name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 默认只读；需要额外权限的任务在 job 级单独声明
permissions:
  contents: read

# 同一分支的重复触发取消旧任务，避免浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（ruff + mypy + pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: 安装依赖（严格锁定版本）
        run: uv sync --frozen

      - name: 代码风格检查
        run: uv run ruff format --check app scripts ../desktop ../TravelFlow.pyw

      - name: 静态检查
        run: uv run ruff check app scripts ../desktop ../TravelFlow.pyw

      - name: 类型检查
        run: uv run mypy app

      - name: 行程与接口测试
        run: uv run pytest -q

      - name: 隔离性能工具冒烟（不设耗时阈值）
        run: PYTHONPATH=. uv run python scripts/benchmark_local.py --samples 2 --output "$RUNNER_TEMP/local-api-smoke.json"

      - name: 移动功能迁移清单覆盖检查
        run: uv run python scripts/check_mobile_inventory.py

      - name: 移动账目参考样例与Python规则一致
        run: PYTHONPATH=. uv run python scripts/export_ledger_vectors.py --check

  frontend:
    name: 前端（typecheck + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖（严格锁定版本）
        run: pnpm install --frozen-lockfile

      - name: 依赖漏洞检查（包含开发依赖，中危及以上阻断）
        run: pnpm audit --audit-level=moderate

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码规范检查
        run: pnpm lint

      - name: 设计约定检查
        run: pnpm check:design

      - name: 生产构建
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: 安装浏览器验收后端依赖
        run: uv sync --frozen --project ../backend

      - name: 安装验收浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: 桌面与手机主流程验收（隔离数据，无需 API Key）
        run: pnpm test:e2e

      - name: 保存失败的浏览器验收证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7

  desktop-runtime:
    name: Desktop runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Isolated process ownership and runtime lifecycle
        env:
          TRAVELFLOW_RUN_NATIVE_UI_TESTS: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: python -m unittest discover -s desktop/tests -v

  desktop-application:
    name: Desktop application (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Explicit preparation (mode-specific environment and build)
        run: uv run --no-project --python 3.13 python -m desktop prepare
      - name: Real Python, Next proxy, SQLite and restart acceptance
        env:
          TRAVELFLOW_RUN_APP_TESTS: "1"
        run: uv run --no-project --python 3.13 python -m unittest discover -s desktop/tests -v

  release-check:
    name: 发布校验（文档链接 + 版本元数据）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 共享契约、源码启动与管理页连接回归
        run: node --test scripts/*.test.mjs

      - name: 检查共享契约摘要与已发布版本不变性
        env:
          CONTRACT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: node scripts/check-contracts.mjs

      - name: 检查文档相对链接与锚点
        run: node scripts/check-docs-links.mjs

      - name: 检查发布元数据（LICENSE、版本、敏感文件、README）
        run: node scripts/check-release.mjs

  dependency-review:
    name: 依赖变更审查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
