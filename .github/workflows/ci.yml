name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的重复触发取消旧任务，避免浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（ruff + mypy + pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖（严格锁定版本）
        run: uv sync --frozen

      - name: 代码风格检查
        run: uv run ruff format --check app

      - name: 静态检查
        run: uv run ruff check app

      - name: 类型检查
        run: uv run mypy app

      - name: 行程与接口测试
        run: uv run pytest -q

  frontend:
    name: 前端（typecheck + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖（严格锁定版本）
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码规范检查
        run: pnpm lint

      - name: 设计约定检查
        run: pnpm check:design

      - name: 生产构建
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: astral-sh/setup-uv@v5

      - name: 安装浏览器验收后端依赖
        run: uv sync --frozen --project ../backend

      - name: 安装验收浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: 桌面与手机主流程验收（隔离数据，无需 API Key）
        run: pnpm test:e2e

      - name: 保存失败的浏览器验收证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7
