name: 功能建议
description: 提出新能力或体验改进建议
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先搜索现有 Issue，并说明要解决的问题，而不只是期望的界面或实现方式。不要在描述中附带 API Key、个人旅行数据或本地绝对路径。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复建议
          required: true
        - label: 我已移除密钥和个人数据
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前流程哪里不方便，在什么旅行场景下会遇到
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 描述期望的行为和结果，不必限定实现细节
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 现在如何绕过这个问题，或你考虑过的其他做法

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 前端界面与交互
        - 后端与规划流程
        - 文档
        - 测试与工程
        - 其他

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 示例、参考产品或相关 Issue
