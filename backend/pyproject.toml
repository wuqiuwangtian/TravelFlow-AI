[project]
name = "travelflow-ai-backend"
version = "1.0.0"
description = "TravelFlow AI 后端服务 —— 本地旅行助手"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "langchain-openai==1.7.0",
    "ddgs>=9.16.0",
    "langgraph==1.2.14",
    "langgraph-checkpoint-sqlite==3.1.1",
    "aiosqlite>=0.22.0",
    "jinja2==3.1.6",
    "markdown-it-py>=4.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "respx>=0.22.0",
    "ruff>=0.14.0",
]

[tool.uv]
# 本项目作为应用运行，不需要打包安装
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI 的 Depends() 默认参数写法

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
# pydantic 插件让 mypy 正确理解 Field(...) 的默认值语义
plugins = ["pydantic.mypy"]

# 起步阶段刻意宽松：先保证「已有注解是对的」，
# 而不是一次性打开全部严格选项淹没在噪声里。
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

ignore_missing_imports = true
