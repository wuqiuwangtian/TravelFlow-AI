[project]
name = "travelflow-ai-backend"
version = "0.1.0"
description = "TravelFlow AI 后端服务 —— 本地旅行助手"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "langchain-openai==1.7.0",
    "ddgs>=9.16.0",
    "langgraph==1.2.14",
    "langgraph-checkpoint-sqlite==3.1.1",
    "aiosqlite>=0.22.0",
    "jinja2==3.1.6",
    "markdown-it-py>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "respx>=0.22.0",
    "ruff>=0.14.0",
]

[tool.uv]
# 本项目作为应用运行，不需要打包安装
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI 的 Depends() 默认参数写法

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
