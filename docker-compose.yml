# ============================================================
#  TravelFlow AI · Docker Compose 部署
#
#  用法：
#    cp .env.example .env      # 填写 API Key（也可留空，启动后在界面里配）
#    docker compose up -d
#    浏览器访问 http://localhost:3000
#
#  可选：自带 SearXNG 检索服务（无需任何第三方 Key）
#    docker compose --profile searxng up -d
#    然后把 .env 中的 SEARCH_PROVIDER 改为 searxng
# ============================================================

name: travelflow-ai

services:
  backend:
    build:
      context: ./backend
    image: travelflow-ai-backend:latest
    container_name: travelflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      # 跨域白名单：默认只放行本机 3100（与前端端口一致）
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3100,http://127.0.0.1:3100}
      APP_CORS_STRICT: ${APP_CORS_STRICT:-true}
      SESSION_DB_PATH: /app/data/travelflow.db

      # ---- 大模型（留空也可启动，之后在界面「设置」中填写）----
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}

      # ---- 检索 ----
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-tavily}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      # 容器内通过服务名访问同网络的 SearXNG
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}

      DEFAULT_DETAIL_LEVEL: ${DEFAULT_DETAIL_LEVEL:-L2_standard}
    volumes:
      # 会话与路书数据持久化，容器重建不丢
      - travelflow-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/system/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* 在构建期被内联，必须在 build args 里给
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    image: travelflow-ai-frontend:latest
    container_name: travelflow-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # ---------------- 可选：自建检索服务 ----------------
  searxng:
    image: searxng/searxng:latest
    container_name: travelflow-searxng
    restart: unless-stopped
    profiles: ["searxng"]
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-please-change-this-secret}

volumes:
  travelflow-data:
    name: travelflow-data
